<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>책갈피 · 스포일러 없는 소설 도우미</title>
<style>
  @font-face {
    font-family: "Pretendard"; font-weight: 45 920; font-style: normal; font-display: swap;
    src: url("/fonts/PretendardVariable.woff2") format("woff2-variations"), url("/fonts/PretendardVariable.woff2") format("woff2");
  }
  /*
    디자인 레퍼런스: Botanical Footer(Bitnomial, Awwwards). 흑백 갤러리 느낌의 A안과 비교해 이 안으로 정했다(2026-10-13).
    - 어두운 바탕 + 포인트 주황 하나, 작은 모노스페이스 대문자 라벨, 작은 주황 상자 버튼,
      윗변이 꺾인 주황 푸터 판과 그 위의 큰 워드마크, 글자가 차오르는 등장 효과.
    - 주황은 의미가 있는 곳에만 쓴다: 보내기, 답마다 붙는 '찾은 범위', 비교 모드의 '아직 안 읽은 장' 인용.
    - 답하지 않을 때 '스포일러 막음' 같은 표시는 하지 않는다. 그 표시 자체가 '뒤에 뭔가 있다'는 힌트가 된다.
    - 글꼴은 Pretendard(OFL) 하나로 통일한다(한글·영문·숫자 모두). 앱이 직접 준다(외부 글꼴 서버 없음).
  */
  :root {
    --bg: #121212; --panel: #1b1b1b; --ink: #f2efe9; --mute: rgba(242, 239, 233, .56); --hair: rgba(242, 239, 233, .12);
    /* 포인트 색: 레퍼런스의 #ff5a36(채도 100%)은 너무 진해서, 같은 주황 계열에서 채도를 낮춘 산호빛을 쓴다 */
    --accent: #dd8b6e; --on-accent: #121212;
    --gutter: clamp(16px, 2.4vw, 36px);
    --page: 1120px;  /* 본문 최대 폭(여백 포함 전) */
    --sans: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* hidden 속성이 .grid·.notice의 display 지정에 덮이지 않게(첫 화면에 대화 화면이 같이 보이던 문제, 2026-10-15) */
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  button, input, textarea, a { font: inherit; color: inherit; }
  /* 작은 라벨. 한글·영문·숫자 모두 Pretendard 하나로 쓰고, 숫자는 폭을 맞춘다(tabular-nums) */
  .small { font-size: 12px; font-weight: 500; letter-spacing: .01em; font-variant-numeric: tabular-nums; }

  /* 위 */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px var(--gutter);
         border-bottom: 1px solid var(--hair); }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand b { font-weight: 700; font-size: 15px; letter-spacing: -.01em; text-transform: none; font-family: var(--sans); }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--on-accent);
          padding: 4px 8px; font-size: 11px; font-weight: 700; letter-spacing: .01em;
          font-variant-numeric: tabular-nums; }
  .menu { display: flex; gap: 18px; align-items: center; }
  .menu button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--mute); }
  .menu button:hover, .menu [aria-pressed="true"] { color: var(--ink); }
  .menu [aria-pressed="true"]::before { content: "● "; color: var(--accent); }

  /* 소개. 제목·카드·대화를 같은 최대 폭(--page) 안에서 가운데로 맞춘다(B안, 2026-10-15).
     전에는 제목만 오른쪽 2/3 칸에서 시작하고 카드는 화면 끝까지 차서 여백 기준이 서로 달랐다. */
  .intro { max-width: var(--page); margin: 0 auto; padding: clamp(28px, 5vh, 56px) var(--gutter) clamp(20px, 3.5vh, 36px);
           display: grid; grid-template-columns: 1fr; gap: var(--gutter); align-items: end; }
  .intro h1 { grid-column: 1; margin: 0; font-weight: 600; font-size: clamp(30px, 4.2vw, 60px); line-height: 1.12; letter-spacing: -.035em; }
  .intro h1 em { font-style: normal; color: var(--accent); }
  .intro p { grid-column: 1; margin: 0; color: var(--mute); max-width: 34em; word-break: keep-all; text-wrap: pretty; }
  .intro .notice { grid-column: 1; display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
  .notice li { border: 1px solid var(--hair); color: var(--ink); padding: 5px 10px; font-size: 12px; }
  .notice li::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 7px;
                       vertical-align: 1px; border-radius: 50%; background: var(--accent); }

  /* 본문 그리드 */
  .grid { display: grid; grid-template-columns: minmax(220px, 1fr) 2fr; gap: var(--gutter); padding: 0 var(--gutter);
          max-width: var(--page); margin: 0 auto; }
  .filter { position: sticky; top: 16px; align-self: start; padding-bottom: 40px; }
  .filter .small { color: var(--mute); margin: 0 0 10px; }
  .chapters { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair); }
  .chapters label { display: grid; grid-template-columns: 2.6em 1fr auto; align-items: baseline; gap: 8px; padding: 7px 0;
                    border-bottom: 1px solid var(--hair); cursor: pointer; }
  .chapters input { position: absolute; opacity: 0; pointer-events: none; }
  .chapters .no { font-size: 12px; font-weight: 600; color: var(--mute); font-variant-numeric: tabular-nums; }
  .chapters .title { font-size: 13px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chapters .unread .title { opacity: .45; }
  .chapters label:hover .title, .chapters label:hover .no { color: var(--ink); }
  .chapters input:checked ~ .no, .chapters input:checked ~ .title { color: var(--ink); }
  .chapters input:checked ~ .mark { width: 8px; height: 8px; background: var(--accent); align-self: center; }
  .chapters input:focus-visible ~ .no { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 대화 */
  .chat { display: flex; flex-direction: column; min-height: 68vh; border-left: 1px solid var(--hair); padding-left: var(--gutter); }
  .thread { flex: 1; display: flex; flex-direction: column; gap: 30px; padding: 4px 0 28px; }
  .thread > * { scroll-margin-bottom: 140px; }
  .hello { margin: 0 0 16px; font-weight: 600; font-size: clamp(19px, 1.8vw, 24px); line-height: 1.4; letter-spacing: -.02em; }
  .hello span { color: var(--mute); }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggest button { border: 1px solid var(--hair); background: transparent; cursor: pointer; padding: 8px 12px;
                    font-size: 14px; }
  .suggest button:hover { border-color: var(--accent); color: var(--accent); }

  .msg { max-width: 86%; }
  .who { display: block; color: var(--mute); margin-bottom: 8px; }
  .msg.me { align-self: flex-end; text-align: right; }
  .msg.me .bubble { display: inline-block; text-align: left; background: var(--ink); color: var(--bg); padding: 12px 16px;
                    font-weight: 600; font-size: 16px; white-space: pre-wrap; word-break: keep-all; }
  .msg.bot { align-self: flex-start; }
  .msg.bot .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .msg.bot .head .who { margin: 0; }
  .answer { margin: 0; font-weight: 500; font-size: clamp(17px, 1.5vw, 20px); line-height: 1.6; letter-spacing: -.01em; word-break: keep-all; }
  .answer.muted { color: var(--mute); }
  .msg.compare { border: 1px dashed var(--hair); padding: 16px; }
  .quotes { list-style: none; margin: 14px 0 0; padding: 0; }
  .quotes li { display: grid; grid-template-columns: 4.6em 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--hair); font-size: 14px; }
  .quotes .ch { font-size: 12px; font-weight: 700; color: var(--mute); padding-top: 2px; }
  .quotes .q { color: var(--mute); }
  .quotes li.future { background: var(--accent); color: var(--on-accent); padding: 10px 12px; border-top: 0; margin-top: 6px; }
  .quotes li.future .ch, .quotes li.future .q { color: var(--on-accent); }
  .quotes .flag { display: block; margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: .01em; }
  .meta { margin-top: 10px; color: var(--mute); }
  .warn { margin: 10px 0 0; color: var(--accent); font-weight: 600; font-size: 14px; }
  .divider { align-self: stretch; display: flex; align-items: center; gap: 12px; color: var(--mute); }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--hair); }
  .typing { display: inline-flex; gap: 6px; padding: 6px 0; }
  .typing i { width: 7px; height: 7px; background: var(--accent); animation: blink 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  /* 아래 고정 입력창 */
  .composer { position: sticky; bottom: 0; background: var(--bg); padding: 14px 0 20px; border-top: 1px solid var(--hair); }
  .composer form { display: flex; align-items: stretch; gap: 8px; }
  .composer textarea { flex: 1; border: 1px solid var(--hair); background: var(--panel); resize: none; padding: 13px 16px;
                       font-size: 16px; line-height: 1.4; max-height: 160px; min-height: 50px; }
  .composer textarea:focus { outline: none; border-color: var(--accent); }
  .composer textarea::placeholder { color: var(--mute); }
  .send { flex: none; border: 0; background: var(--accent); color: var(--on-accent); padding: 0 18px; cursor: pointer;
          font-size: 14px; font-weight: 700; }
  .send:hover:not(:disabled) { filter: brightness(1.08); }
  .send:disabled { opacity: .4; cursor: wait; }
  .hint { margin: 8px 0 0; color: var(--mute); }

  /* 주황 푸터 + 큰 워드마크 */
  footer { margin-top: 72px; background: var(--accent); color: var(--on-accent); padding: 64px var(--gutter) 18px;
           clip-path: polygon(0 28px, 31% 28px, 31% 0, 100% 0, 100% 100%, 0 100%); }
  .foot { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .foot p { margin: 0; max-width: 30em; font-size: 15px; line-height: 1.5; word-break: keep-all; text-wrap: pretty; }
  .foot ul { list-style: none; margin: 0; padding: 0; text-align: right; display: grid; gap: 4px; }
  /* 워드마크는 글자 수(--n)에 맞춰 줄인다. 두 글자일 때 예전 크기(27vw)와 같다 */
  .wordmark { --n: 2; margin: clamp(24px, 4vw, 48px) 0 0; font-weight: 700; font-size: clamp(56px, calc(54vw / var(--n)), 420px);
              line-height: .82; letter-spacing: -.06em; display: flex; overflow: hidden; padding-bottom: .04em; white-space: pre; }
  .wordmark span { display: inline-block; transform: translateY(105%); transition: transform .9s cubic-bezier(.2, .7, 0, 1); }
  .wordmark.in span { transform: none; }
  .copy { margin-top: 10px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* 첫 화면: 소설 고르기 */
  .shelf { padding: 0 var(--gutter); max-width: var(--page); margin: 0 auto; }
  .shelf-label { color: var(--mute); margin: 0 0 12px; }
  /* 구분선은 카드 테두리로 그린다(배경으로 그리면 마지막 줄의 빈칸이 회색으로 칠해진다) */
  .books { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
           border-top: 1px solid var(--hair); border-left: 1px solid var(--hair); }
  .books > li { border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
  .book { display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 8px; min-height: 230px; padding: 26px 24px 22px;
          background: var(--bg); text-decoration: none; }
  .book:hover, .book:focus-visible { background: var(--panel); outline: none; }
  .book:hover .book-go, .book:focus-visible .book-go { color: var(--accent); }
  .book-no { color: var(--mute); }
  .book-title { font-size: clamp(26px, 2.4vw, 34px); font-weight: 650; letter-spacing: -.03em; line-height: 1.15; }
  .book-meta { color: var(--mute); }
  .book-blurb { color: var(--ink); opacity: .82; word-break: keep-all; text-wrap: pretty; }
  .book-go { color: var(--mute); align-self: end; }

  /* 장이 많은 작품: 번호로 고르기 */
  .range { border-top: 1px solid var(--hair); padding-top: 14px; display: grid; gap: 12px; }
  .stepper { display: flex; align-items: stretch; gap: 6px; }
  .stepper button { width: 44px; border: 1px solid var(--hair); background: transparent; cursor: pointer; font-size: 18px; }
  .stepper button:hover { border-color: var(--accent); color: var(--accent); }
  .stepper input { width: 100%; border: 1px solid var(--hair); background: var(--panel); padding: 8px 12px; font-size: 20px;
                   font-weight: 650; font-variant-numeric: tabular-nums; text-align: center; }
  .stepper input:focus { outline: none; border-color: var(--accent); }
  .range input[type="range"] { width: 100%; accent-color: var(--accent); }
  .range .small { color: var(--mute); margin: 0; }

  @media (max-width: 760px) {
    .intro, .grid { grid-template-columns: 1fr; }
    .intro h1, .intro p, .intro .notice { grid-column: 1; }
    .filter { position: static; padding-bottom: 12px; }
    .chapters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; border-top: 0; }
    .chapters label { grid-template-columns: 1fr; border: 1px solid var(--hair); text-align: center; padding: 6px 0; }
    .chapters .title, .chapters .mark { display: none; }
    .chapters label:has(input:checked) { background: var(--accent); border-color: var(--accent); }
    .chapters input:checked ~ .no { color: var(--on-accent); }
    .chat { border-left: 0; padding-left: 0; }
    .msg { max-width: 100%; }
    .brand .chip { display: none; }
    footer { clip-path: polygon(0 20px, 45% 20px, 45% 0, 100% 0, 100% 100%, 0 100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wordmark span { transform: none; transition: none; }
    .typing i { animation: none; opacity: .7; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <a href="#/" style="text-decoration:none"><b>책갈피</b></a>
    <span class="chip" aria-hidden="true">↳ 읽은 데까지만</span>
  </div>
  <nav class="menu small" aria-label="보기">
    <button type="button" id="back" hidden>← 다른 소설</button>
    <button type="button" id="compare" aria-pressed="false" aria-describedby="compare-desc" hidden>필터 없이 비교</button>
    <button type="button" id="reset" hidden>새 대화</button>
  </nav>
  <span id="compare-desc" hidden></span>
</header>

<section class="intro" aria-labelledby="title">
  <h1 id="title">읽은 데까지만 답하는<br>소설 <em>도우미</em></h1>
  <p>스포일러 걱정 없이 물어보세요.<br>읽은 장까지만 찾아보고, 근거 문장도 함께 보여 드려요.</p>
  <ul class="notice" id="notice" aria-label="이용 안내" hidden></ul>
</section>

<main class="shelf" id="home" aria-label="소설 고르기">
  <p class="small shelf-label">어떤 소설을 읽고 있나요?</p>
  <ul class="books" id="books"></ul>
</main>

<main class="grid" id="reader" hidden>
  <aside class="filter">
    <p class="small" id="chapters-label">어디까지 읽었나요?</p>
    <div id="picker"></div>
  </aside>

  <section class="chat" aria-label="대화">
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="composer">
      <form id="ask-form">
        <label for="question" hidden>질문</label>
        <textarea id="question" rows="1" maxlength="300" placeholder="읽은 데까지 궁금한 걸 물어보세요" required></textarea>
        <button class="send" id="send" type="submit">보내기 ↵</button>
      </form>
      <p class="hint small" id="hint"></p>
    </div>
  </section>
</main>

<footer>
  <div class="foot">
    <p id="foot-note">다음 장이 궁금해도 결말은 지켜 드려요.<br>읽은 데까지만 답하는 스포일러 없는 독서 도우미.</p>
    <ul class="small" id="credits"></ul>
  </div>
  <div class="wordmark" id="wordmark" aria-hidden="true"></div>
  <div class="copy small"><span id="copy-tech">SPOILER-FREE READING · LOCAL LM STUDIO</span><span>PROTOTYPE · 2026</span></div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pad = (n) => String(n).padStart(2, "0");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const GRID_MAX = 30;  // 이보다 장이 많으면(「무정」 126장) 목록 대신 번호로 고른다
let works = [];
let work = null;      // 지금 고른 작품(/api/works의 카드)
let chapterList = [];
let upto = 1;
let lastAskedUpto = null;
let busy = false;
let openSeq = 0;      // 작품을 열 때마다 늘린다. 늦게 온 응답이 지금 작품 화면을 덮지 않게 한다

/* 워드마크: 글자마다 span, 글자 수만큼 크기를 줄인다 */
function setWordmark(text) {
  const chars = [...text];
  $("wordmark").style.setProperty("--n", Math.max(2, chars.length));
  $("wordmark").innerHTML = chars.map((c, i) => `<span style="transition-delay:${(i * 0.08).toFixed(2)}s">${esc(c)}</span>`).join("");
}
function setCredits(lines) { $("credits").innerHTML = lines.map((l) => `<li>${esc(l)}</li>`).join(""); }

/* 첫 화면: 소설 카드 */
function renderBooks() {
  $("books").innerHTML = works.map((w, i) => `<li><a class="book" href="#/${encodeURIComponent(w.id)}">
    <span class="book-no small">${pad(i + 1)}</span>
    <strong class="book-title">${esc(w.title)}</strong>
    <span class="book-meta small">${esc(w.author)} · ${esc(w.published)} · ${w.chapters}장</span>
    <span class="book-blurb">${esc(w.blurb)}</span>
    <span class="book-go small">읽은 데까지 물어보기 →</span>
  </a></li>`).join("");
}
function showHome() {
  work = null; openSeq++;
  document.title = "책갈피 · 스포일러 없는 소설 도우미";
  $("title").innerHTML = "읽은 데까지만 답하는<br>소설 <em>도우미</em>";
  $("home").hidden = false; $("reader").hidden = true;
  for (const id of ["back", "compare", "reset"]) $(id).hidden = true;
  setWordmark("책갈피");
  setCredits(["저작권이 끝난 한국 소설", "원문 · 위키문헌", "공유 저작물"]);
}
async function showWork(w) {
  work = w;
  document.title = `「${w.title}」 · 책갈피`;
  $("title").innerHTML = `읽은 데까지만 답하는<br>「${esc(w.title)}」 <em>도우미</em>`;
  $("home").hidden = true; $("reader").hidden = false;
  for (const id of ["back", "compare", "reset"]) $(id).hidden = false;
  $("compare-desc").textContent = `데모용: ${w.chapters}장 전체에서 찾고 스포일러를 막지 않은 답을 같이 보여 준다`;
  setWordmark(w.title);
  setCredits([`${w.author} 「${w.title}」`, w.published, "공유 저작물 · 위키문헌"]);
  upto = w.default_upto;
  const seq = ++openSeq;
  const list = await fetch(`/api/chapters?work=${encodeURIComponent(w.id)}`).then((r) => r.json());
  if (seq !== openSeq) return;  // 그사이 다른 작품을 열었다
  chapterList = list;
  renderPicker();
  emptyState();
  scrollTo({top: 0, behavior: reduce ? "auto" : "smooth"});
}
function route() {
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const w = works.find((x) => x.id === id);
  if (w) showWork(w); else showHome();
}

/* 장 고르기: 고른 장까지만 제목을 보여 준다. 장이 많으면 번호 입력과 막대로 고른다 */
function setUpto(n) {
  upto = Math.min(Math.max(1, Number(n) || 1), work.chapters);
  renderPicker();
  if ($("thread").querySelector(".empty")) emptyState();  // 예시는 고른 장까지 나온 인물·사건만
}
function renderPicker() {
  if (work.chapters > GRID_MAX) {
    if (!$("upto-num")) {
      $("picker").innerHTML = `<div class="range">
        <div class="stepper">
          <button type="button" data-step="-1" aria-label="한 장 앞으로">−</button>
          <input type="number" id="upto-num" min="1" max="${work.chapters}" inputmode="numeric" aria-labelledby="chapters-label">
          <button type="button" data-step="1" aria-label="한 장 뒤로">+</button>
        </div>
        <input type="range" id="upto-range" min="1" max="${work.chapters}" aria-label="읽은 장">
        <p class="small">전체 ${work.chapters}장</p>
      </div>`;
    }
    $("upto-num").value = upto; $("upto-range").value = upto;
  } else {
    $("picker").innerHTML = `<ul class="chapters" id="chapters" role="radiogroup" aria-labelledby="chapters-label">${chapterList.map((c) => {
      const read = c.chapter <= upto;
      const title = read ? (c.title ? esc(c.title) : `제${c.chapter}장`) : "아직 안 읽음";
      return `<li class="${read ? "" : "unread"}"><label>
        <input type="radio" name="upto" value="${c.chapter}" ${c.chapter === upto ? "checked" : ""}>
        <span class="no">${pad(c.chapter)}</span>
        <span class="title">${title}</span>
        <span class="mark"></span>
      </label></li>`;
    }).join("")}</ul>`;
  }
  $("hint").textContent = `${pad(upto)}장까지 읽은 기준 · Enter 보내기 · Shift+Enter 줄바꿈`;
}
$("picker").addEventListener("change", (e) => {
  if (e.target.name === "upto") {
    setUpto(e.target.value);
    document.querySelector(`input[name="upto"][value="${upto}"]`)?.focus();
  } else if (e.target.id === "upto-num" || e.target.id === "upto-range") {
    setUpto(e.target.value);
  }
});
$("picker").addEventListener("input", (e) => { if (e.target.id === "upto-range") setUpto(e.target.value); });
$("picker").addEventListener("click", (e) => {
  const b = e.target.closest("[data-step]");
  if (b) setUpto(upto + Number(b.dataset.step));
});

/* 대화 */
function emptyState() {
  // 예시 질문은 고른 장 이하에서 답과 인물이 다 나오는 것만 보여 준다(뒤 장 인물 이름이 예시로 새지 않게)
  const examples = work ? work.examples.filter((e) => e.from <= upto).map((e) => e.question) : [];
  $("thread").innerHTML = `<div class="empty">
    <p class="hello">안녕하세요. 읽은 장을 고르고 물어보세요.<br><span>아직 안 읽은 내용은 말하지 않을게요.</span></p>
    <div class="suggest">${examples.map((q) => `<button type="button">${esc(q)}</button>`).join("")}</div>
  </div>`;
  lastAskedUpto = null;
}
function append(html) {
  $("thread").querySelector(".empty")?.remove();
  $("thread").insertAdjacentHTML("beforeend", html);
  const last = $("thread").lastElementChild;
  last.scrollIntoView({block: "end", behavior: reduce ? "auto" : "smooth"});
  return last;
}
function userMsg(q) {
  if (lastAskedUpto !== null && lastAskedUpto !== upto) append(`<div class="divider small">이제 ${pad(upto)}장까지 읽음</div>`);
  lastAskedUpto = upto;
  append(`<div class="msg me"><span class="who small">나 · ${pad(upto)}장까지 읽음</span><span class="bubble">${esc(q)}</span></div>`);
}
function head(label, scope) {
  return `<div class="head"><span class="who small">${esc(label)}</span>${scope ? `<span class="chip">${esc(scope)}</span>` : ""}</div>`;
}
function typing(label) {
  return append(`<div class="msg bot">${head(label)}<span class="typing" aria-label="답을 찾는 중"><i></i><i></i><i></i></span></div>`);
}
function botHtml(label, scope, r) {
  const quotes = r.quotes.map((q) => `
    <li class="${q.future ? "future" : ""}"><span class="ch">제${q.chapter}장</span>
      <span class="q">${esc(q.text)}${q.future ? '<span class="flag">아직 안 읽은 장</span>'
        : (q.verified ? "" : '<span class="flag">원문에서 확인 안 됨</span>')}</span></li>`).join("");
  const future = r.future_entities.length ? `<p class="warn">아직 안 나온 인물: ${r.future_entities.map(esc).join(", ")}</p>` : "";
  return `${head(label, scope)}
    <p class="answer ${r.status === "answered" ? "" : "muted"}">${esc(r.answer)}</p>
    ${quotes ? `<ul class="quotes">${quotes}</ul>` : ""}${future}
    <p class="meta small">찾아본 장 ${r.retrieved_chapters.length ? r.retrieved_chapters.map(pad).join(" · ") : "없음"} — ${r.latency_s ?? "-"}초${r.format_problem ? " — 응답 형식 문제" : ""}</p>`;
}
async function ask(w, condition, question, n) {
  const res = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
                                      body: JSON.stringify({work: w.id, question, upto: n, condition})});
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
}
async function reply(w, condition, label, scope, question, n, extraClass = "") {
  const slot = typing(label);
  try {
    const r = await ask(w, condition, question, n);
    if (work !== w) return;  // 기다리는 사이 다른 화면으로 갔다. 새 대화에 붙이지 않는다
    slot.className = `msg bot ${extraClass}`;
    slot.innerHTML = botHtml(label, scope, r);
  } catch (err) {
    slot.innerHTML = `${head(label)}<p class="answer muted">${esc(err.message)}</p>`;
  }
  slot.scrollIntoView({block: "end", behavior: reduce ? "auto" : "smooth"});
}
async function send(question) {
  question = question.trim();
  if (!question || busy || !work) return;
  const w = work;  // 기다리는 사이 작품이 바뀌어도 이 질문은 이 작품에만 묻는다
  busy = true; $("send").disabled = true;
  $("question").value = ""; autosize();
  const n = upto;
  try {
    userMsg(question);
    // 범위 표시는 답했든 안 했든 똑같이 붙인다(답하지 않았다는 사실이 '뒤에 뭔가 있다'는 힌트가 되지 않게).
    await reply(w, "C4", "책갈피", `↳ 01–${pad(n)}장에서 찾음`, question, n);
    if (work === w && $("compare").getAttribute("aria-pressed") === "true") {
      await reply(w, "C1", `비교 · 필터 없이 ${w.chapters}장 전체에서 찾으면`, `↳ 01–${pad(w.chapters)}장`, question, n, "compare");
    }
  } finally {
    busy = false; $("send").disabled = false;
    if (work === w) $("question").focus();
  }
}

function autosize() { const t = $("question"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }
$("question").addEventListener("input", autosize);
$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send($("question").value); }
});
$("ask-form").addEventListener("submit", (e) => { e.preventDefault(); send($("question").value); });
$("thread").addEventListener("click", (e) => { if (e.target.closest(".suggest button")) send(e.target.textContent); });
$("compare").addEventListener("click", (e) => {
  e.currentTarget.setAttribute("aria-pressed", String(e.currentTarget.getAttribute("aria-pressed") !== "true"));
});
$("reset").addEventListener("click", () => { if (!busy) { emptyState(); $("question").focus(); } });
$("back").addEventListener("click", () => { if (!busy) location.hash = "#/"; });
addEventListener("hashchange", route);

/* 푸터 워드마크: 화면에 들어오면 글자가 아래에서 차오른다 */
if (reduce || !("IntersectionObserver" in window)) {
  $("wordmark").classList.add("in");
} else {
  new IntersectionObserver((entries, obs) => {
    if (entries.some((e) => e.isIntersecting)) { $("wordmark").classList.add("in"); obs.disconnect(); }
  }, {threshold: 0.3}).observe($("wordmark"));
}

/* 공개 데모일 때 이용 안내 */
fetch("/api/config").then((r) => r.json()).then((c) => {
  if (!c.public) return;
  $("notice").innerHTML = ["회원가입 없이 무료", "첫 질문은 준비하느라 조금 걸려요", "하루 질문 횟수 제한"]
    .map((t) => `<li>${esc(t)}</li>`).join("");
  $("notice").hidden = false;
  $("copy-tech").textContent = "SPOILER-FREE READING · CLAUDE API · AWS LAMBDA";
}).catch(() => {});
fetch("/api/works").then((r) => r.json()).then((list) => { works = list; renderBooks(); route(); });
</script>
