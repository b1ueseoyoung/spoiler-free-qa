[project]
name = "sfqa"
version = "0.1.0"
description = "「탁류」 회차 스포일러 없는 작품 Q&A (LangChain RAG, LM Studio 로컬 모델)"
readme = "README.md"
authors = [
    { name = "이서영", email = "sylee@toonion.co.kr" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "kiwipiepy>=0.24.0",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "mwparserfromhell>=0.7.2",
    "numpy>=2.5.4",
    "pydantic>=2",
]

[project.scripts]
sfqa = "sfqa:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
